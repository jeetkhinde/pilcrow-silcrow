[web]
host = "127.0.0.1"
port = 3000

# ── Fragment directories ─────────────────────────────────────────────────────
# Each entry is a directory of URL-accessible HTML fragments.
# The `dir` key is relative to the project root. The URL prefix defaults to the
# dir name.
#
# [[fragments]]
# dir = "widgets"           # → /widgets/**
#
# [[fragments]]
# dir = "ui-blocks"
# url = "blocks"            # → /blocks/** (explicit override)

[[fragments]]
dir = "widgets"

[routing]
ignore_directories = ["react"]

[imports]
ui = "ui"

[client.react]
enabled = true
dirs = ["react"]
max_island_kb = 80
max_page_react_kb = 220
warn = true
fail_on_budget = false

[i18n]
default_locale = "en"
locales        = ["en", "de"]
locales_dir    = "locales"

[images]
enabled     = true
cache_dir   = ".pilcrow-image-cache"
domains     = []
max_width   = 3840
max_height  = 2160
quality     = 80
formats     = ["webp", "jpeg"]
concurrency = 4
