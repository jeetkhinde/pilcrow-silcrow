---
import Nav from "ui/Nav.html";

pub struct Props {}
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <slot name="pilcrow_head"><title>Pilcrow</title></slot>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            color: #1a1a1a;
            background: #fff;
        }
        h1 { font-size: 1.75rem; margin: 0 0 1.25rem; }
        p { line-height: 1.6; color: #444; }

        /* Nav */
        nav { display: flex; gap: 1.5rem; margin-bottom: 2.5rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
        nav a { text-decoration: none; color: #555; font-weight: 500; font-size: 0.95rem; }
        nav a:hover { color: #000; }

        /* Category filter */
        .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
        .categories button {
            padding: 0.3rem 0.85rem;
            border: 1px solid #ddd;
            border-radius: 999px;
            background: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            text-transform: capitalize;
            color: #444;
            transition: background 0.1s, border-color 0.1s;
        }
        .categories button:hover { background: #f4f4f4; border-color: #aaa; color: #111; }

        /* Product grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
        }
        .product-card {
            border: 1px solid #eee;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.15s, transform 0.15s;
            background: #fff;
        }
        .product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            padding: 1rem;
            background: #fafafa;
        }
        .product-info {
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1;
        }
        .product-category {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #999;
        }
        .product-title {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
            color: #1a1a1a;
        }
        .product-price {
            font-size: 1rem;
            font-weight: 700;
            color: #111;
            margin: 0;
            margin-top: auto;
            padding-top: 0.4rem;
        }
    </style>
</head>
<body>
    <Nav />
    <slot />
    <script src="{{ pilcrow_web::assets::assets::silcrow_js_path() }}" defer></script>
</body>
</html>
