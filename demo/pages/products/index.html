---
import ProductCard from "ui/ProductCard.html";
---
<pilcrow:head>
<title>Products — Pilcrow</title>
<meta name="description" content="Browse our product catalog" />
</pilcrow:head>

<h1>Products</h1>

<div class="categories">
    <a href="/products" s-boost s-target="#page-content"
       class="{% if active_category.is_empty() %}active{% endif %}">All</a>
    {% for cat in &categories %}
    <a href="/products?category={{ cat.slug }}" s-boost s-target="#page-content"
       class="{% if active_category == cat.slug %}active{% endif %}">{{ cat.label }}</a>
    {% endfor %}
</div>
<div id="product-grid" class="product-grid">
    {% for product in &products %}
    <ProductCard
                 id={product.id}
                 title={product.title}
                 price_display={product.price_display}
                 image={product.image}
                 category={product.category} />
    {% endfor %}
</div>
