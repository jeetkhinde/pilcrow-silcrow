<pilcrow:head>
  <title>{{ name }} - Pilcrow Contacts</title>
</pilcrow:head>

<article id="contact" class="mx-auto grid max-w-4xl gap-8 md:grid-cols-[13rem_1fr]">
  <div>
    <img class="h-52 w-52 rounded-lg border border-slate-200 bg-white object-cover shadow-sm" alt="{{ name }} avatar" src="{{ avatar }}" />
  </div>
  <div class="min-w-0">
    <h1 class="flex flex-wrap items-center gap-3 text-4xl font-bold tracking-tight text-slate-950">
      {% if first.len() > 0 || last.len() > 0 %}{{ first }} {{ last }}{% else %}<i>No Name</i>{% endif %}
      <form method="post" action="?/favorite" s-post="?/favorite" s-optimistic="favorite_mark">
        <input type="hidden" name="text"
               value="{% if favorite %}☆{% else %}★{% endif %}" />
        <input type="hidden" name="class"
               value="{% if favorite %}text-slate-400{% else %}text-amber-500{% endif %}" />
        <button
          class="rounded-md px-2 text-3xl leading-none hover:bg-amber-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
          aria-label="{% if favorite %}Remove from favorites{% else %}Add to favorites{% endif %}"
          name="favorite"
          value="{% if favorite %}false{% else %}true{% endif %}"
          type="submit">
          <span
            data-pilcrow-live-field="favorite_mark"
            s-live:text="favorite_mark.text"
            s-live:class="favorite_mark.class"
            data-s-live-mod
            class="{{ live.favorite_mark.value.class }}"
          >{{ live.favorite_mark.value.text }}</span>
        </button>
      </form>
    </h1>
    {% if twitter.len() > 0 %}
    <p class="mt-2"><a class="font-medium text-blue-700 hover:text-blue-900 rounded-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2" href="https://twitter.com/{{ twitter }}">@{{ twitter }}</a></p>
    {% endif %}
    {% if notes.len() > 0 %}
    <p class="mt-6 whitespace-pre-line leading-7 text-slate-700">{{ notes }}</p>
    {% else %}
    <p class="mt-6 italic text-slate-500">No notes yet.</p>
    {% endif %}
    <p class="mt-4 text-sm text-slate-500"><span s-live="updated_label">{{ live.updated_label.value }}</span></p>
    <div class="mt-8 flex flex-wrap gap-3">
      <form method="get" action="/contacts/{{ id }}/edit">
        <button class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2" type="submit">Edit</button>
      </form>
      <form method="post" action="?/destroy" s-post="?/destroy" onsubmit="return confirm('Please confirm you want to delete this record.')">
        <button class="rounded-md border border-red-200 bg-white px-4 py-2 text-sm font-semibold text-red-700 shadow-sm hover:bg-red-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2" type="submit">Delete</button>
      </form>
    </div>
  </div>
</article>
