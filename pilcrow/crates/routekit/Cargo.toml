# crates/routekit/Cargo.toml
[package]
name = "pilcrow-routekit"
version = "0.1.0"
edition = "2024"
authors = ["Pilcrow Contributors"]
license = "MIT"
description = "File-based routing for Rust web frameworks with support for dynamic segments, catch-all routes, and optional parameters."
keywords = ["router", "web", "file-based", "routing", "framework-agnostic"]
categories = ["web-programming"]
readme = "README.md"

[lib]
name = "routekit"
path = "src/lib.rs"
doctest = false

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4.18"
fluent-syntax = "0.11"
urlencoding = "2.1"
markdown = "1.0.0-alpha.18"
serde_yaml = "0.9"

[dev-dependencies]
pretty_assertions = "1.4"
rstest = "0.22"
