[package]
name = "pilcrow-web"
version = "0.1.0"
edition = "2024"
description = "Web/SSR integration layer for Pilcrow applications"
license = "MIT"

[features]
lambda = ["runtime/lambda"]
live-props = ["runtime/live-props"]

[dependencies]
pilcrow-core = { path = "../core" }
runtime = { package = "pilcrow-runtime", path = "../runtime" }
pilcrow-client = { path = "../client" }
pilcrow-macros = { path = "../macros" }
axum = "0.7"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
