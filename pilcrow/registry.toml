[[features]]
id = "list-broadcast-producer"
name = "ListBroadcast — Server-Side List Patch Producer"
domain = "pilcrow"
status = "stable"
summary = "ListBroadcast is a clone-safe broadcast channel for keyed list row changes. send_row<T: ListRow> extracts the key and live fields from a typed row and fans out a ListPatchEvent to all SSE subscribers."
spec = """
Register as an Axum Extension at startup. Mutation handlers call send_row or send_patch
when a row changes. SSE handlers subscribe and relay events as SilcrowEvent::list_patch.

  // Startup
  let lb = ListBroadcast::new(256);
  app.layer(Extension(lb.clone()));

  // Mutation
  lb.send_row("tickets", &updated_ticket);  // T: ListRow

  // SSE route handler
  let mut rx = lb.subscribe();
  match rx.recv().await {
      Ok(ev) => emit.send(SilcrowEvent::list_patch(ev.list_name, ev.key, ev.fields)).await?,
      Err(RecvError::Lagged(_)) => continue,
      Err(RecvError::Closed) => break Ok(()),
  }
"""
