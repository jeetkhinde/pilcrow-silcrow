Part of DEV_INJECTION. Uses silcrow:live:disconnect and silcrow:live:connect events on the
hidden `#__pilcrow_dev` SSE element as build-start / build-end signals:

  silcrow:live:disconnect → 2 s debounce → fixed bottom-right banner: "pilcrow: building…"
  silcrow:live:connect    → clear timer + remove banner

When a compile error prevents the server from starting, the connection stays down and the banner
stays visible indefinitely — signalling the user to check the terminal.

When the build succeeds, the server starts → SSE reconnects → banner clears → silcrow:sse:reload
fires → location.reload().

No server-side changes required — entirely client-driven via silcrow lifecycle events.
