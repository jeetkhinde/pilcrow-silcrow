status = "stable"
summary = "Route paths are derived from files and directories under pages and api."
spec = "index.html maps to its containing directory, dynamic segments use bracket syntax [param], route groups use parenthesized directories (group), and generated route helpers live in OUT_DIR."
canonical_usage = "pages/index.html -> GET /. pages/products/index.html -> GET /products. pages/[id]/index.html -> GET /:id. pages/(admin)/dashboard.html -> GET /dashboard (group stripped). pages/[id=integer]/index.html -> GET /:id with integer constraint."
constraints = [
  "Page routes must live under pages.",
  "API routes must live under api.",
  "Dynamic params use [name] syntax; constraint matchers use [name=matcher] syntax.",
  "Route groups use (name) syntax — strips the name from the URL.",
  "index.html in a directory maps to the directory path.",
]
