[[features]]
id = "csrf"
name = "CSRF Protection"
domain = "pilcrow"
status = "stable"
summary = "Always-on Origin-header CSRF middleware applied to all form submissions by the generated router."
spec = "Pilcrow applies csrf_middleware as a tower layer inside build_router(). It validates Origin (falling back to Referer) against the request Host for all state-changing requests (POST/PUT/PATCH/DELETE) with a form Content-Type. Cross-origin JSON API requests are not checked — the browser same-origin policy and CORS preflight cover them. Missing Origin AND Referer rejects the request. No token needed — the check is header-based."
canonical_usage = """
CSRF protection is automatic — no setup required. The generated router in build_router()
applies csrf_middleware to all routes via axum::middleware::from_fn.

For testing: set the Origin header to match the Host header, or use s-post/s-get which
Silcrow sets automatically via the silcrow-target header (Silcrow also sends Origin on
same-origin requests, so enhanced requests pass automatically).

For plain HTML forms: same-origin forms automatically send Origin or Referer, so
standard browser forms work without any changes.

For API clients / test scripts, set the Origin header:
  curl -X POST http://localhost:3000/items?/create \
    -H "Origin: http://localhost:3000" \
    -d "name=widget"

If you need to opt specific API routes out of CSRF (e.g. webhooks), handle that
in hooks.rs by checking req.path and returning early:
  pub async fn middleware(req: Req, next: Next) -> Response {
      // Webhook endpoint bypasses CSRF (verified by signature instead)
      if req.path.starts_with("/api/webhooks/") {
          return next.run().await;
      }
      next.run().await
  }
Note: csrf_middleware still runs — the above illustrates hooks.rs flow.
To truly bypass, add a separate axum layer before csrf in build_router() (advanced).
"""
