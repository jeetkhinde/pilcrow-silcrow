[feature.markdown_pages]
name = "Markdown Pages"
status = "stable"
spec = """
`.md` and `.mdx` files placed anywhere in `pages/` or a configured fragment directory
become routes using the same conventions as `.html` files.

- `pages/posts/hello.md` → `GET /posts/hello`
- `widgets/intro.md` → `GET /widgets/intro`
- GitHub Flavored Markdown (GFM) is compiled to HTML at build time via `markdown-rs`.
- YAML frontmatter (between `---` delimiters at the top of the file) is stripped from
  the rendered output and currently discarded. Use a code-behind `.rs` file to set page
  options (`PRERENDER`, `LAYOUT`, `TRAILING_SLASH`) or define `load()` / actions.
- Code-behind `.rs` files work identically to HTML pages: `hello.md` pairs with `hello.rs`.
- Route groups, param matchers, and layout wrapping all apply to `.md` files exactly as
  they do to `.html` files.
- MDX component expansion (JSX tags inside markdown) is not yet supported; JSX tags are
  preserved in the rendered HTML but will not be recognised by the component transpiler.
"""
canonical_usage = """
<!-- pages/posts/hello.md -->
# Hello World

This is a **markdown** page with a [link](/about).
"""
