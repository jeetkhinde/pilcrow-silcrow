[[features]]
id = "ssg"
name = "Bake on first hit (PROMOTE_AFTER = 0)"
domain = "pilcrow"
status = "stable"
summary = "FSR with PROMOTE_AFTER = 0: route is baked on its very first request and served from Redis on all subsequent requests. There is no separate SSG code path — this is FSR with a threshold of zero."
spec = """
Setting pub const PROMOTE_AFTER: u32 = 0 in page.rs is the canonical way to request
bake-on-first-hit behaviour. The route goes through the standard FSR handler; on the first
hit the HTML + JSON are written to Redis (pilcrow:html:<route>, pilcrow:json:<route>) and
all subsequent requests skip load() entirely.

For dynamic routes (patterns with :param segments), an entries() function is required:
  pub async fn entries() -> Vec<HashMap<String, String>>
  Returns the list of path-param combinations to pre-render at startup.

PROMOTE_AFTER: u32 = 0 is stripped from the emitted module — never appears in generated Rust.
PRERENDER: bool is removed — using it is a build error.
"""
canonical_usage = """
// pages/about.rs — bake on first hit
pub const PROMOTE_AFTER: u32 = 0;
pub struct Props { pub title: String }
pub async fn load(_req: Req) -> AppResult<Props> {
    Ok(Props { title: "About Us".to_string() })
}

// pages/products/[id].rs — dynamic route, bake on first hit per param combo
pub const PROMOTE_AFTER: u32 = 0;
pub struct Props { pub product: Product }
pub async fn entries() -> Vec<HashMap<String, String>> {
    db::all_product_ids().await.into_iter()
        .map(|id| [("id".to_string(), id.to_string())].into())
        .collect()
}
pub async fn load(req: Req) -> AppResult<Props> {
    let id = req.params.get("id").unwrap();
    Ok(Props { product: db::find(id).await? })
}
"""
