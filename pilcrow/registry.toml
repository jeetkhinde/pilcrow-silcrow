[[features]]
id = "actions"
name = "Named Actions"
domain = "pilcrow"
status = "stable"
summary = "Page and fragment code-behind files can declare named action handlers for enhanced and plain form posts."
spec = "Named actions are public functions other than load that return ActionResult, commonly `pub async fn create(req: Req) -> ActionResult`. The client invokes them with ?/name URL fragment (POST only) on the page or fragment URL. Unknown action names return AppError::NotFound. Use `ok()` to return a 200 with no body, `redirect(path)` for a 303. Both return ActionResult and support chaining via ActionResultExt: `.with_toast(msg, level)`, `.with_header(key, val)`, `.trigger_event(name)`, `.no_cache()`, `.retarget(sel)`, `.push_history(url)`. All these helpers plus ActionResultExt and ToastLevel are auto-imported in every page module."
canonical_usage = "In products/index.rs: `pub async fn create(req: Req) -> ActionResult { let name = req.form.get(\"name\").unwrap_or(\"\"); redirect(\"/products\").with_toast(\"Created!\", ToastLevel::Success) }`. For mutations with no redirect: `pub async fn toggle(_req: Req) -> ActionResult { toggle_state(); ok().with_toast(\"Done\", ToastLevel::Success) }`. In template: `<form s-post=\"?/create\">`."
constraints = [
  "Action fns must return ActionResult (or Result<Response, AppError>).",
  "Action fns must be POST-only — GET requests do not trigger actions.",
  "Plain POST without ?/name fragment returns 404.",
  "Layouts cannot define named actions.",
  "UI components must not define named actions.",
]
invalid_examples = [
  "pub async fn submit() -> ActionResult — missing Req argument",
  "pub async fn submit(req: Req) -> Response — wrong return type",
  "Using actions in a _layout.rs code-behind",
]
source_refs = [
  "crates/routekit/src/templating/codegen/page_routes.rs",
  "crates/routekit/src/templating/codegen/instrument.rs",
  "crates/runtime/src/response/response.rs",
]
test_refs = ["crates/routekit/src/templating/codegen/tests.rs"]
validation_rules = [
  "Named action handlers should return ActionResult.",
  "Actions should live next to the page template they serve.",
  "Use ok() for 200 OK responses, not Ok(StatusCode::OK.into_response()).",
  "Use redirect(path) or ok() — both chain .with_toast(), .with_header(), etc. via ActionResultExt.",
]
scaffold_templates = ["route", "silcrow-form"]

[[features]]
id = "server-hooks"
name = "Server Hooks"
domain = "pilcrow"
status = "stable"
summary = "Optional hooks.rs lifecycle hooks for global request handling, 5xx error shaping, and one-time startup init."
spec = "When hooks.rs exists, Pilcrow detects and wires any of these async functions: `handle(req: Req, next: Next) -> Response`, `handle_error(error: &HookError, req: &Req) -> Option<Response>`, and `init()`. `handle` runs before route handlers, `handle_error` can replace 5xx responses, and `init` runs once before serving."
canonical_usage = "Create hooks.rs with: `pub async fn handle(req: Req, next: Next) -> Response { req.locals.set(\"trace-id\"); next.run().await }`, `pub async fn handle_error(error: &HookError, req: &Req) -> Option<Response> { tracing::error!(\"{}\", error.message); None }`, and `pub async fn init() { tracing::info!(\"startup\"); }`."
constraints = [
  "Hook file must be hooks.rs at the app root.",
  "Hook function signatures must match exactly (async, argument types, return type).",
  "handle() should call next.run().await unless intentionally short-circuiting.",
  "Use req.locals in hooks for cross-cutting request state shared with load()/actions.",
]
invalid_examples = [
  "fn handle(req: Req, next: Next) -> Response — missing async",
  "pub async fn handle_error(error: HookError, req: Req) -> Response — wrong references and return type",
  "Placing hooks in hooks.rs expecting automatic lifecycle wiring",
]
source_refs = [
  "crates/routekit/src/templating/pipeline.rs — hook detection",
  "crates/routekit/src/templating/codegen/app_module.rs — generated hook shims and middleware wiring",
  "sandbox/hooks.rs",
]
test_refs = ["crates/routekit/src/templating/pipeline.rs — detect_hook_flags tests"]
validation_rules = [
  "Prefer hooks.rs for global auth/session/request-id logic over duplicating in each load()/action.",
]
scaffold_templates = ["middleware"]

