  "STREAMING = true is incompatible with REVALIDATE (structured build error).",
  "STREAMING = true is incompatible with PRERENDER = true (structured build error).",
  "STREAMING = true cannot be combined with Deferred<T> or DeferredHtml fields (structured build error).",
  "STREAMING = true does not support PilcrowClient in load() (structured build error).",
