[[features]]
status = "stable"
name = "Optimistic Mutations"
spec = """
Optimistic mutations let the client apply an instant UI update before the server
round-trip completes, then confirm or revert based on the outcome.

Three layers work together:

1. **Client (`silcrow.js`)** — `Silcrow.publishOptimistic(scope, data, mutationId)` snapshots
   the current atom value and patches it immediately.  On network error or non-2xx response,
   `revertOptimistic(mutationId)` restores the snapshot automatically.
   `confirmOptimistic(mutationId)` retires the pending entry (called internally when the
   server echoes the mutation id back through SSE/WS patch or HTTP `silcrow-patch` header).

2. **Server (Rust)** — `req.mutation_id()` reads the `silcrow-mutation-id` request header.
   Pass it to `SilcrowEvent::patch(...).with_mutation_id(id)` (SSE) or
   `WsEvent::patch(...).with_mutation_id(id)` (WS) so the client can confirm the mutation.
   For HTTP action responses, use `req.res.patch_target_with_mutation(selector, data, id)`.

3. **React hook** — `useSilcrowMutation({ url, optimistic, onSuccess, onError })` wraps the
   full lifecycle: optimistic apply → fetch → confirm/revert.

The stale-patch guard drops server-pushed SSE/WS patches for a scope that has an in-flight
pending mutation, preventing a flash of stale data between the optimistic update and the
server echo.
"""
canonical_usage = """
// --- Rust action handler ---
pub async fn add_to_cart(req: Req) -> ActionResult {
    // … perform mutation …
    let mid = req.mutation_id();
    if let Some(id) = mid {
        req.res.patch_target_with_mutation("#cart", &json!({"count": 4}), id);
    } else {
        req.res.patch_target("#cart", &json!({"count": 4}));
    }
    ok()
}

// --- SSE stream handler ---
pub async fn feed(emitter: SseEmitter, req: Req) -> Result<(), EmitError> {
    let data = json!({"count": 5});
    let event = if let Some(id) = req.mutation_id() {
        SilcrowEvent::patch(data, "#cart").with_mutation_id(id)
    } else {
        SilcrowEvent::patch(data, "#cart")
    };
    emitter.send(event).await
}

// --- React island ---
const {mutate, pending, error} = useSilcrowMutation({
  url: "/cart/add/1",
  optimistic: { scope: "route:/cart", data: {count: cart.count + 1} },
  onSuccess: (r) => console.log("confirmed", r.mutationId),
  onError: () => console.error("reverted"),
});
return <button onClick={() => mutate()} disabled={pending}>Add to cart</button>;
"""
constraints = [
  "publishOptimistic requires a live atom registered under `scope` — the scope must match a `s-bind` attribute or a seeded route atom.",
  "The stale-patch guard keyed on `s-bind` scope only applies to elements in the DOM at the time the patch arrives. Unmounted elements are not tracked.",
  "mutationId is auto-generated (timestamp + random suffix) when omitted from `options.optimistic`.",
  "with_mutation_id() is a no-op on non-Patch event kinds (Navigate, Html, etc.).",
]
source_refs = [
