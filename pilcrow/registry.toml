id = "islands"
name = "Islands"
domain = "pilcrow"
status = "stable"
summary = "Server-driven islands via <island> template tag: deferred server-rendered HTML fetched by silcrow with load/visible/idle strategies. Co-located in pages/*/islands/ or shared via [[fragments]]."
spec = """
Islands are implemented as of 2026-04-27.

The <island> self-closing tag compiles to a silcrow s-get + s-html deferred fetch:
  <island src="./counter" strategy="visible" count="42" />

Compiled output per tag:
  1. Container: <div id="__pi_N" data-pilcrow-island>
  2. Trigger: <a id="__pi_Nt" s-get="URL" s-html s-target="#__pi_N" s-skip-history style="display:none">
  3. Strategy script:
     - load (default) — calls .click() immediately
     - visible — IntersectionObserver calls .click() when container enters viewport
     - idle — requestIdleCallback (fallback: setTimeout 200ms) calls .click()

Silcrow handles the s-get fetch and replaces the container div with the HTML response.
While loading, silcrow adds class="silcrow-loading" aria-busy="true" to the container.

URL resolution for src=:
  - "./name" or bare "name" → {page_url_base}/islands/{name}
  - "/absolute/path" → used as-is

Extra attributes (beyond src and strategy) are forwarded as query params.
Values may contain Askama expressions: count="{{ props.count }}" → ?count=<rendered_value>.

Island files are ordinary fragment files (load(), actions, no layout wrapping).
The island's load() reads params from req.query.

Co-location (auto-detected, no Pilcrow.toml entry needed):
  pages/dashboard/islands/counter.html  → GET /dashboard/islands/counter
  pages/dashboard/islands/counter.rs    → load(), actions

Shared cross-page islands use [[fragments]] in Pilcrow.toml as before.
