[[features]]
id = "i18n"
name = "Internationalisation (i18n)"
domain = "pilcrow"
status = "stable"
since = "0.1.0"
summary = "Fluent-based i18n with typed compile-time t:: helpers, prefix-except-default URL routing, bundle caching, and locale-aware req.fmt() formatting."
spec = """
Configure in `Pilcrow.toml` under `[i18n]`:

```toml
[i18n]
default_locale = "en"          # Served at bare URLs (no prefix). Default: "en".
locales        = ["en", "de", "fr"]  # All supported locales.
locales_dir    = "locales"     # Relative to src/. Default: "locales".
```

**File layout:**
```
locales/
  en/
    messages.ftl   # One or more .ftl files per locale
  de/
    messages.ftl
  fr/
    messages.ftl
```

**URL strategy — prefix-except-default:**
- Default locale (e.g. `en`) → `/products` (no prefix)
- Other locales → `/de/products`, `/fr/products`

The locale middleware strips the prefix before routing so page handlers see the canonical path.
`req.locale` contains the detected locale string (e.g. `"de"`).

**Typed translation helpers (generated by routekit):**

routekit parses `.ftl` files from the default locale at build time and generates `pub mod t` with
one typed function per message key. FTL message ids are converted to snake_case Rust identifiers.

```ftl
# locales/en/messages.ftl
greeting = Hello, { $name }!
product-count = { $count ->
    [one] { $count } product
   *[other] { $count } products
}
welcome = Welcome
```

Generates:
```rust
pub mod t {
    pub fn greeting(req: &Req, name: impl Display) -> String;
    pub fn product_count(req: &Req, count: impl Display) -> String;
    pub fn welcome(req: &Req) -> String;
}
```

**Usage in code-behind:**
```rust
pub async fn load(req: Req) -> AppResult<Props> {
    Ok(Props {
        heading: t::greeting(&req, &user.name),
        count_label: t::product_count(&req, items.len()),
    })
}
```

**Usage in templates:**
```html
<h1>{{ props.heading }}</h1>
```

**Low-level access:**
```rust
req.__t("greeting", &[("name", &user.name)])  // returns String, falls back to key on miss
```

**Locale-aware formatting:**
```rust
req.fmt().number(1_234_567)   // "1,234,567" (en) | "1.234.567" (de)
req.fmt().float(19.99, 2)     // "19.99" (en) | "19,99" (de)
```

**Fallback chain:** requested locale → default locale → return key verbatim.

**Missing locale directory:** emits a tracing warning but does not fail startup.
"""
constraints = [
  "When locales = [], i18n is disabled and pub mod t {} is generated (empty, no-op).",
  "The default locale is served at bare URLs — do NOT add a URL prefix for it.",
  "Non-default locales must be accessed with a URL prefix (/de/, /fr/, etc.).",
  "FTL files are loaded at startup; changing them requires a server restart.",
  "Typed t:: functions are generated from the default locale's .ftl files only.",
  "FTL message ids with hyphens become underscore Rust fn names: product-count → product_count.",
  "FTL attributes (button.label) become underscore fn names: button_label.",
  "req.locale is empty string when i18n is not configured.",
]
canonical_usage = """
# Pilcrow.toml
[i18n]
default_locale = "en"
locales        = ["en", "de"]
locales_dir    = "locales"

# locales/en/messages.ftl
greeting = Hello, { $name }!

# pages/index.rs
pub async fn load(req: Req) -> AppResult<Props> {
    Ok(Props { heading: t::greeting(&req, "World") })
}
"""
