[[features]]
id = "adapter-trait"
name = "PilcrowAdapter Trait + Platform Adapters"
domain = "pilcrow"
status = "stable"
summary = "Pluggable deployment adapter — built-in adapters for Lambda, Fly, Railway, Cloud Run, Render, Vercel, and bare metal."
spec = """
`PilcrowAdapter` is a single-method trait:

    pub trait PilcrowAdapter: Send + 'static {
        fn serve(self, bind_addr: &str, app: Router) -> AdapterFuture;
    }

where `AdapterFuture = Pin<Box<dyn Future<Output = ()>>>` (no Send required — adapters run from main()).

The adapter receives the fully-wired `Router` (ISR extensions, middleware, timeout, TraceLayer all applied)
and the bind address from Pilcrow.toml. It is responsible for binding the socket and serving.

Use `start_with_adapter(router, prerender_fn, MyAdapter)` instead of `start(router)`.

## Built-in adapters (all in `pilcrow_web::adapters`)

| Adapter | Platform | Feature flag |
|---|---|---|
| `TokioAdapter` | Local / VPS / bare metal | default |
| `PortEnvAdapter` (aliases: `FlyAdapter`, `RailwayAdapter`, `CloudRunAdapter`, `RenderAdapter`, `VercelAdapter`) | Any platform injecting `PORT` env var | default |
| `LambdaAdapter` | AWS Lambda, Vercel Functions (Lambda-backed), Netlify | `lambda` |

`PortEnvAdapter` reads `PORT` env var and binds to `0.0.0.0:{PORT}`; falls back to `Pilcrow.toml` address.
`LambdaAdapter` requires `pilcrow-web = { features = ["lambda"] }` and converts axum bodies to/from lambda_http bodies per invocation.
"""
canonical_usage = """
// Fly.io / Railway / Render / Cloud Run (reads PORT env var):
use pilcrow_web::adapters::FlyAdapter;
pilcrow_web::start_with_adapter(pilcrow_router(), |_| async {}, FlyAdapter).await;

// AWS Lambda (add features = ["lambda"] to pilcrow-web in Cargo.toml):
use pilcrow_web::adapters::LambdaAdapter;
pilcrow_web::start_with_adapter(pilcrow_router(), |_| async {}, LambdaAdapter).await;

// Custom adapter:
use pilcrow_web::{PilcrowAdapter, AdapterFuture};
struct MyAdapter;
impl PilcrowAdapter for MyAdapter {
    fn serve(self, bind_addr: &str, app: axum::Router) -> AdapterFuture {
        Box::pin(async move { /* bind and serve */ })
    }
}
"""
