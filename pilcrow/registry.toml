registry_schema_version = 1
framework_version = "0.1.0"

[[features]]
id = "ssr-pages"
name = "SSR Pages"
domain = "pilcrow"
status = "stable"
summary = "Server-rendered pages are discovered from pages/**/*.html with optional Rust code-behind."
spec = "A page is an HTML template under pages. A sibling .rs file may declare Props and an async load(req: Req) -> AppResult<Props> function. Pages are registered by generated code through pilcrow_web::include_generated_app!()."
canonical_usage = "Create pages/products/index.html and pages/products/index.rs. In index.rs: `pub struct Props { pub items: Vec<String> }` and `pub async fn load(_req: Req) -> AppResult<Props> { Ok(Props { items: vec![] }) }`. Access in template: `{{ items }}`."
constraints = [
  "Page .html files must live under pages/.",
  "Code-behind load() must be async, return AppResult<Props>, and accept Req.",
  "Props must be a public struct named Props.",
  "Do not call pilcrow_web::include_generated_app!() manually — the pilcrow_app!() macro does it.",
]
invalid_examples = [
  "fn load() -> Props — missing async, wrong return type",
  "pub async fn load() -> AppResult<Props> — missing Req argument",
  "Manually registering a page route in main.rs with .route()",
]
source_refs = [
  "crates/routekit/src/templating/codegen/page_routes.rs",
  "crates/routekit/src/templating/codegen/instrument.rs",
  "crates/web/src/lib.rs",
]
test_refs = [
  "crates/routekit/src/templating/codegen/tests.rs",
  "sandbox/pages/index.rs",
]
validation_rules = [
  "Pages should not manually register Axum routes.",
  "Code-behind load functions should be async and return AppResult<Props>.",
]
scaffold_templates = ["route"]

[[features]]
