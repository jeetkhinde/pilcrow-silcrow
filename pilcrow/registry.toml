[[features]]
id = "ssr-streaming"
name = "SSR Streaming (STREAMING = true)"
domain = "pilcrow"
status = "stable"
summary = "Pages opt into progressive SSR: layout loads complete first, page load() runs in the background, and the shell renders immediately. Resolved Props are streamed as a single Silcrow.patch() call."
spec = """
Declare `pub const STREAMING: bool = true;` in a page's code-behind to enable streaming mode.

Execution flow:
  1. Layout loads run sequentially (preserving req.locals propagation between layouts and page).
  2. Page load() is spawned with tokio::spawn immediately after all layout loads complete.
  3. The shell renders with layout data + default page Props values and is flushed to the client.
  4. A `window.__ps` shim is injected before </head> in the shell HTML.
  5. When page load() resolves, Props is serialized to JSON and streamed as:
       <script>window.__ps({...props_json...})</script>
     which calls `Silcrow.patch(props, document.body)` to update all reactive bindings.
  6. Streaming HTML responses include `silcrow-full-reload: true` so silcrow boosted
     top-level GET navigation falls back to browser navigation instead of buffering
     the whole stream as fetch text.

The `window.__ps` shim:
  <script>window.__ps=function(v){Silcrow.patch(v,document.body)}</script>

Page templates should use silcrow.js reactive bindings (:text, :value, etc.) for fields that
should update after the shell renders. Askama {{ field }} interpolations render the default
value in the shell and are NOT updated by the streaming patch.

Constraints:
- Props: all page Props fields used in reactive bindings must implement Default.
  For no-layout pages, #[derive(Default)] is automatically injected on Props.
  For layout pages, each page field is constructed with Default::default() individually.
- STREAMING is incompatible with REVALIDATE (ISR) — use Deferred<T> for that case.
- STREAMING is incompatible with PRERENDER (SSG) — pre-rendered pages are fully static.
- STREAMING is incompatible with Deferred<T> / DeferredHtml fields — use one mechanism.
- STREAMING does not support PilcrowClient in page load() — use Deferred<T> instead.
- STREAMING without load() is a no-op (silently ignored).
"""
canonical_usage = """
// pages/products.rs
pub const STREAMING: bool = true;

pub struct Props {
    pub title: String,
    pub items: Vec<Product>,
}

pub async fn load(_req: Req) -> AppResult<Props> {
    let items = db::get_products().await?;
    Ok(Props { title: "Products".into(), items })
}

// Template uses reactive bindings so the patch updates the DOM:
// <h1 :text="title"></h1>
// <template s-for="item in items" :key="item.id">...</template>
"""
