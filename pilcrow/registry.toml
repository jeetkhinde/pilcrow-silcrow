[[features]]
id = "fsr"
name = "FSR (Field-Selective Rendering)"
domain = "pilcrow"
status = "stable"
summary = "Field-Selective Rendering — inline Live struct convention, LiveProp<T>, watcher, auto s-live slots, SSE hub. Developer-facing surface via `use pilcrow::live::*;`."
spec = "FSR enables per-field SSE-driven live updates. A page code-behind exports an inline Live struct with LiveProp<T> fields plus impl Live { query(...) -> LiveQuery }. Routekit auto-inserts s-live=\"field\" wrappers for text-node uses of {{ live.field.value }}, leaves attribute/object uses unchanged, and validates the resulting page.html template against the inline Live contract at build time. Every explicit s-live=\"field\" slot must match a LiveProp field, every LiveProp field must be used as {{ live.field.value }} or have a matching s-live slot unless marked #[pilcrow::allow_unused], and duplicate s-live slot names are rejected with a clear error. Struct-level #[debounce(N)] and #[pilcrow::depends_on_route(table, param)] defaults apply to every LiveProp field, and field-level attributes override those defaults. #[debounce(N)] sets a debounce window in seconds; put it on the Live struct for a default or on a LiveProp field for an override. Debounce means coalescing repeated invalidations so one latest-value patch is sent after the quiet window. The embedded watcher enforces this via last_patched_at in pilcrow_fsr: a stale slot is skipped until last_patched_at + debounce_secs <= NOW(). Per-field debounce_secs overrides the global [fsr] patch_debounce_secs (default 0 = patch immediately). depends_on_route(tickets, id) expands conceptually to dep!(tickets, id, params.id) and is valid only when the route has an id param; explicit #[pilcrow::depends_on(dep!(...))] remains the escape hatch. LiveProp<T> fields are individually addressable over a shared SSE connection. The FSR watcher polls a LiveQuery and pushes SlotPatch events when values change. Routes opt in with `use pilcrow::live::*;` and the `live-props` Cargo feature. Redis (live-props-redis feature) adds a three-layer serve architecture: Redis is the hot path (pilcrow:html:<route>, pilcrow:slot:<route> HASH, pilcrow:json:<route>), Postgres is the truth layer (pilcrow_fsr table), and disk is async recovery. The watcher becomes pub/sub-driven: it subscribes to pilcrow:invalidate, re-executes stored queries, patches Redis, then publishes pilcrow:patch which is forwarded to connected SSE clients. Without Redis, the watcher falls back to 500ms polling. redis_url in [fsr] of pilcrow.toml is required when using live-props-redis. Per-field scheduled revalidation cascade: #[revalidate(N)] on a Props LiveProp<T> field wins over any global config; it generates synthetic dep key \"{module}::__revalidate_{N}s\" (shared across all fields on the same route with the same interval — one timer per route+interval pair). Alternatively, #[depends_on(\"key\")] wires the field to an existing static dep key; mutually exclusive with #[revalidate(N)]. Fields with an explicit depends_on in inline Live are excluded from all revalidation timers. Fields with none of the above receive a default timer using the global revalidation interval: `[fsr] revalidate_seconds` in Pilcrow.toml, or 86400 (24 h) when not configured. Synthetic dep keys (__revalidate_Ns, __revalidate_default) are internal framework details invisible to developers. Codegen calls __register_codegen_scheduled_invalidations() (per-interval deduped timers) and __register_codegen_default_revalidate_routes() (routes needing default timer); start() merges both into WatcherConfig::scheduled_invalidations at startup. Cache persistence and eviction: artifact_ttl_secs (default 86400) sets an EX TTL on pilcrow:html:*, pilcrow:json:*, and pilcrow:slot:* Redis keys so orphaned entries expire automatically. idle_evict_secs (default 1800) controls how often the idle-eviction background task runs; idle_threshold_secs (default 86400) is how long a route must be cold before it is un-promoted (promoted=FALSE, hit_count=0) and its Redis keys and baked disk artifacts are deleted. Un-promoted routes re-enter the normal promotion cycle on the next request. Set idle_evict_secs=0 to disable eviction. All three fields are configurable in the [fsr] section of Pilcrow.toml. [cache] provider: memory and filesystem are implemented; sqlite and redis cause a startup panic until backends land."

canonical_usage = """
use pilcrow::live::*;

#[debounce(30)]
#[pilcrow::depends_on_route(tickets, id)]
pub struct Live {
    pub ticket_status: LiveProp<String>,
    #[debounce(5)]
    pub ticket_priority: LiveProp<String>,
}

impl Live {
    fn query(params: &serde_json::Map<String, serde_json::Value>) -> LiveQuery {
        live_query!(
            "SELECT status AS ticket_status, priority AS ticket_priority FROM tickets WHERE id = $1",
            params.get("id").unwrap()
        )
    }
}

# page.rs — with per-field scheduled revalidation (no manual depends_on needed)
pub struct Props {
    pub live: Live,
    #[revalidate(60)]   // re-bake every 60 s; synthetic dep key "page_tickets::__revalidate_60s"
    pub price: LiveProp<f64>,
    #[revalidate(60)]   // same route + same interval = one shared timer
    pub market_cap: LiveProp<f64>,
    #[revalidate(30)]   // different interval = separate timer; dep key "page_tickets::__revalidate_30s"
    pub volume: LiveProp<u64>,
    pub summary: LiveProp<String>,  // no #[revalidate] → uses [fsr] revalidate_seconds or 24h default
}
pub async fn load(live: Live) -> AppResult<Props> { Ok(Props { live, price: LiveProp::initial(0.0), market_cap: LiveProp::initial(0.0), volume: LiveProp::initial(0), summary: LiveProp::initial(String::new()) }) }

# page.html
{{ live.ticket_status.value }}
"""
constraints = [
  "Incompatible with STREAMING = true",
  "FSR_JSON = true incompatible with STREAMING = true",
  "Route bake threshold is set via pub const PROMOTE_AFTER: u32 = N in page.rs; 0 means bake on first hit. PROMOTE_AFTER is only coherent on routes with a finite known instance set (e.g. static routes like /). On dynamic routes with an open ID-space (e.g. /contacts/[id]), every distinct URL gets a separate pilcrow_fsr row marked promoted=TRUE on first hit; html_path will be NULL (no baked file written by the framework), so the watcher logs warnings for missing files. Use PROMOTE_AFTER only on static or near-static routes.",
  "Struct-level #[debounce(N)] sets a per-field debounce default in seconds; field-level #[debounce(N)] overrides it.",
  "Struct-level #[pilcrow::depends_on_route(table, param)] defaults apply to all LiveProp<T> fields.",
  "Field-level #[pilcrow::*] attributes override struct-level live defaults for that field.",
  "Routekit auto-inserts s-live wrappers for text-node uses of {{ live.field.value }}.",
  "s-live patches only textContent — never CSS classes, attributes, or src. Attribute expressions like class=\"badge-{{ live.field.value }}\" are rendered at SSR time by Minijinja and are never touched by SSE patches. If a live field controls both displayed text and a CSS class (e.g. a status badge that changes colour), use the object path: define a struct with text + class fields, mark the LiveProp with #[pilcrow::allow_unused], and use s-use=\"fsr.slot\" on the element. The s-use binding spreads text → textContent and class → className on every SSE patch.",
  "Each explicit s-live slot in page.html must match a LiveProp field in inline Live.",
  "Each LiveProp field in inline Live must be used as {{ live.field.value }} or have a matching s-live slot unless marked #[pilcrow::allow_unused].",
  "Duplicate s-live slot names in a single template are build errors.",
  "depends_on_route(table, param) requires `param` to exist in the route params.",
  "dep! macro args mean table, column, runtime value.",
  "Requires the `live-props` Cargo feature on pilcrow-web",
  "#[revalidate(N)] is only valid on LiveProp<T> fields in Props — not in inline Live.",
  "#[depends_on(\"key\")] wires a Props LiveProp<T> field to a static dep key; mutually exclusive with #[revalidate(N)].",
  "#[debounce(N)] is valid on inline Live structs/fields, not on Props #[pilcrow::live(...)] attrs.",
  "#[debounce(N)] is enforced by the watcher via last_patched_at column (migration 0003). patch_debounce_secs = 0 (default) means patch immediately.",
]
invalid_examples = [
  "Using LiveProp<T> outside of a struct that implements PilcrowLive",
  "Adding s-live=\"ticket_status\" in HTML while inline Live only declares `status`",
  "Declaring a LiveProp field in inline Live without using {{ live.field.value }}, adding a matching s-live slot, or marking #[pilcrow::allow_unused]",
  "Repeating the same s-live slot name multiple times in one template",
  "Forgetting to enable the live-props feature in Cargo.toml",
  "Using a scalar LiveProp<String> for a badge field where class=\"badge-{{ live.status.value }}\" controls colour — the class is baked at SSR time and never patched by SSE; the badge text changes but the colour stays stale. Use an object LiveProp<StatusBadge> with text + class fields and s-use=\"fsr.status\" instead.",
]
