summary = "Pre-render at server startup AND revalidate on a TTL — startup-warm ISR."
spec = """
When a page declares both PRERENDER = true and REVALIDATE = <secs>, routekit:
1. Includes the page in __pilcrow_prerender_all() — rendered once at server startup,
   stored in the ISR cache with the ISR TTL (not u64::MAX).
2. The request handler is the full ISR stale-while-revalidate handler — Fresh/Stale/Miss
   states apply as normal after the TTL expires.
3. CACHE_TAGS and CACHE_VARY are respected in both startup prerendering and runtime.

