[[features]]
id = "image-optimization"
name = "Image Optimization"
domain = "pilcrow"
status = "stable"
summary = "Serve optimized images via `/_image?src=&w=&q=&f=` with disk cache, concurrency control, and `<pilcrow:image>` template tag transpilation."
spec = """
Enable in Pilcrow.toml:

```toml
[images]
enabled     = true
cache_dir   = ".pilcrow-image-cache"
domains     = []              # allowed remote domains; empty = local-only
max_width   = 3840
max_height  = 2160
quality     = 80
formats     = ["webp", "jpeg"]
concurrency = 4
```

Use in templates:

```html
<pilcrow:image src="/public/hero.jpg" width="1200" alt="Hero" />
<!-- transpiles to -->
<img src="/_image?src=%2Fpublic%2Fhero.jpg&w=1200" alt="Hero" width="1200" loading="lazy" decoding="async">
```

Query parameters:
- `src` — URL-encoded source path (required)
- `w` — output width in pixels
- `h` — output height in pixels
- `q` — quality override (1-100)
- `f` — format: `webp`, `jpeg`, `png`, or `auto` (picks from `formats` list)

The endpoint caches transforms to disk (hash-sharded by 2-char prefix).
Cache files are served with `Cache-Control: public, max-age=31536000, immutable`.
CPU transforms run in `spawn_blocking` behind a `Semaphore(concurrency)` to prevent overload.
"""
canonical_usage = """
# Pilcrow.toml
[images]
enabled = true
quality = 80
formats = ["webp", "jpeg"]

# pages/index.html
<pilcrow:image src="/public/product.jpg" width="600" alt="Product" class="product-img" />
"""
