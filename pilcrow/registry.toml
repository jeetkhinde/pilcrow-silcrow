[[features]]
id = "deferred-streams"
name = "Deferred Streams"
domain = "pilcrow"
status = "stable"
summary = "Deferred<T> and DeferredHtml stream late data or HTML patches after the shell response."
spec = "Props may include Deferred<T> or DeferredHtml fields. Generated code emits a shell first and streams patches as futures resolve. Deferred<T>/AsyncValue<T> template interpolations become `data-pilcrow-async-value` text targets and resolved values stream as `window.__pilcrow_async_value(key, value)` scripts that set `textContent` directly. DeferredHtml/AsyncHtml template interpolations become `data-pilcrow-async-html` targets and resolved HTML streams as `window.__pilcrow_async_html(key, html)` scripts that replace target children. Streaming HTML responses include `silcrow-full-reload: true` so silcrow boosted top-level GET navigation falls back to browser navigation instead of buffering and sanitizing streamed script chunks."
canonical_usage = "pub struct Props { pub title: String, pub count: Deferred<i32> }. pub async fn load(_req: Req) -> AppResult<Props> { Ok(Props { title: String::from(\"Hello\"), count: Deferred::spawn(async { expensive_db_call().await }) }) }. In template: {{ count }} (renders as empty string until resolved)."
