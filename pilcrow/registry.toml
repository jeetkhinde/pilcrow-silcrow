summary = "Persist ISR cache entries as JSON files — cache survives server restarts with zero external dependencies."
spec = """
Set provider = "filesystem" in [cache] in Pilcrow.toml. The cache reads all .json files from
the configured directory at startup (warm start after restart) and writes a file on every
cache store using a temp-file plus rename flow. Invalidation (by path or tag) also deletes
the corresponding files and logs deletion failures.

File names are based on a CRC32 hash of the cache key; the full key, HTML, TTL, and tags
are stored in the file so the cache can be fully restored on reload.

