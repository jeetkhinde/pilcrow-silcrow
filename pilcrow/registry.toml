[[features]]
id = "react-islands"
name = "React Islands"
domain = "pilcrow"
status = "stable"
summary = "Client-only React widgets mounted with <react> tags, scoped to ignored react directories and lazy-loaded by strategy."
spec = """
React islands are client-only widgets. Pilcrow renders the page or fragment first;
React mounts only inside explicit <react> containers.

They are not the same thing as Pilcrow HTML islands/fragments: a React component
does not currently get its own sibling `.rs` code-behind. Put server loading,
actions, caching, auth, and response shaping in the containing page/fragment
code-behind, then pass data to React through props, route JSON, Silcrow atoms,
or Pilcrow named actions.

Canonical tag:
  <react src="./react/Counter.tsx" strategy="visible" count="{{ props.count }}" />

Placement follows Pilcrow.toml folder rules:
  pages/dashboard/react/Counter.tsx   — page-local widget
  pages/dashboard/react/Counter.jsx   — page-local widget without TypeScript
  widgets/react/FavoriteButton.tsx    — fragment-local widget
  src/react/DataGrid.tsx                  — shared widget

Required config:
  [routing]
  ignore_directories = ["react"]

  [client.react]
  enabled = true
  dirs = ["react"]

Routekit resolves relative src values from the containing page or fragment file.
Root src values like /react/DataGrid.tsx resolve from src/react/DataGrid.tsx.
Extra attributes are passed to the React component as string props, with kebab-case
names converted to camelCase by the browser loader.

The build runs Vite only when <react> tags are present. It emits hashed browser
chunks under /_pilcrow/client/** and a tiny loader at /_pilcrow/react-islands.js.
Silcrow fragment swaps trigger the loader to scan newly inserted HTML.

react-islands.js loader behavior:
- The loader scans the current document for [data-pilcrow-react] mount nodes.
- data-strategy controls scheduling: load mounts immediately, visible mounts
  through IntersectionObserver, idle mounts through requestIdleCallback or a
  timeout fallback.
- data-prop-* attributes become React props; kebab-case prop names become
  camelCase.
- data-css is a comma-separated list of generated CSS assets; each CSS URL is
  loaded once into document.head.
- data-src is dynamically imported. The generated Vite wrapper exports mount()
  and also registers window.__pilcrowReactMounts[id] as a fallback.
- The same mount node is only mounted once. If mounting fails, the node is made
  mountable again for a later scan.
- The loader listens for silcrow:patched and rescans inserted or patched HTML.

React project dependencies:
  package.json dependencies: react, react-dom
  package.json devDependencies: vite, @vitejs/plugin-react
  package.json devDependencies for TypeScript apps: typescript

TypeScript is optional. Use .jsx React sources if the app wants to avoid
TypeScript entirely. Use .tsx only when the component source itself uses
TypeScript syntax. The generated Pilcrow wrapper is compiled by Vite.

React 19 hook-first API patterns:
- Import the built-in hook module from "pilcrow/react". It is a Vite alias
  generated by Pilcrow for React island builds, not a separate npm package.
- Built-in hooks: useSilcrowAtom(scope, initialValue),
  useSilcrowPrefetch(path), useSilcrowRoute(path, initialValue),
  useSilcrowAction(url, reducer, initialState, options), and
  publishSilcrowAtom(scope, data).
- Subscribe to Silcrow route, stream, or user-named atom scopes with
  useSyncExternalStore over Silcrow.subscribe(scope, notify) and
  Silcrow.snapshot(scope).
- Read route JSON with React 19 use(Silcrow.prefetch(path)) inside Suspense.
  Silcrow.prefetch(path) memoizes the Promise until mutation or error, so React
  does not suspend-loop from promise churn.
- Submit Pilcrow named actions from React with Silcrow.submit(url, body,
  { method: "POST", scope }). Use this when React owns local form state;
  prefer plain HTML forms with s-post for routine server forms.
- Seed window.__silcrow_seed before silcrow.js loads when Pilcrow already has
  the first route payload and the React island should avoid a duplicate request.
- Non-GET Silcrow.submit calls clear cached route responses and prefetched
  promises. Use invalidate_target for DOM binding-cache invalidation.
"""
canonical_usage = """
// Pilcrow.toml
[routing]
ignore_directories = ["react"]

[client.react]
enabled = true
dirs = ["react"]
max_island_kb = 80
max_page_react_kb = 220
warn = true
fail_on_budget = false

<!-- pages/dashboard/index.html -->
<react src="./react/Counter.jsx" strategy="visible" initial-count="{{ count }}" />

// pages/dashboard/react/Counter.jsx
export default function Counter({ initialCount = "0" }) {
  return <button>{initialCount}</button>;
}

// React 19 route data with Suspense + use()
import { Suspense, use, useMemo } from "react";
import { useSilcrowAtom } from "pilcrow/react";

function ProductRows({ promise }) {
  const initial = use(promise);
  const data = useSilcrowAtom("route:/products", initial);
  return (
    <ul>
      {data.items.map((item) => (
        <li key={item.id}>{item.name} - {item.price}</li>
      ))}
    </ul>
  );
}

export function ProductPanel({ path = "/products" }) {
  const promise = useMemo(() => window.Silcrow.prefetch(path), [path]);
  return (
    <Suspense fallback={<p>Loading products...</p>}>
      <ProductRows promise={promise} />
    </Suspense>
  );
}

// React 19 action submission with useActionState
import { useSilcrowAction } from "pilcrow/react";

function normalizeCreateProduct(result) {
  if (!result.ok) return result.data ?? { ok: false, message: `HTTP ${result.status}` };
  return result.data ?? { ok: true, message: "Saved" };
}

export function ProductCreateForm() {
  const [state, formAction, pending] = useSilcrowAction(
    "?/create",
    normalizeCreateProduct,
    { ok: true },
    { scope: "products:create" },
  );
  return (
    <form action={formAction}>
      <input name="name" aria-invalid={Boolean(state.errors?.name)} />
      {state.errors?.name ? <p role="alert">{state.errors.name}</p> : null}
      <button disabled={pending}>{pending ? "Saving..." : "Save"}</button>
      {state.message ? <p>{state.message}</p> : null}
    </form>
  );
}

// Matching Pilcrow named action shape
use pilcrow_web::{form_errors, json, ActionResult, Req};

pub async fn create(req: Req) -> ActionResult {
    let name = req.form.get("name").unwrap_or("").trim();
    if name.is_empty() {
        return req.fail(form_errors().error("name", "Name is required"));
    }
    req.res.invalidate_target("#products");
    json(serde_json::json!({ "ok": true, "message": "Product created" }))
}
"""
