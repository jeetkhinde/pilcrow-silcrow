[[features]]
id = "fsr"
name = "FSR (Field-Selective Rendering)"
domain = "pilcrow"
status = "stable"
summary = "Field-Selective Rendering — live.rs convention, LiveProp<T>, watcher, s-live slots, SSE hub. Developer-facing surface via `use pilcrow::live::*;`."
spec = "FSR enables per-field SSE-driven live updates. A route's live.rs exports a Live struct with LiveProp<T> fields. Routekit validates the sibling page.html template against live.rs at build time: every s-live=\"field\" slot must match a LiveProp field, every LiveProp field must have a matching s-live slot unless the field is marked #[pilcrow::allow_unused], and duplicate s-live slot names are rejected with a clear error. Struct-level #[pilcrow::live(...)] and #[pilcrow::depends_on_route(table, param)] defaults apply to every LiveProp field, and field-level attributes override those defaults. depends_on_route(tickets, id) expands conceptually to dep!(tickets, id, params.id) and is valid only when the route has an id param; explicit #[pilcrow::depends_on(dep!(...))] remains the escape hatch. LiveProp<T> fields are individually addressable over a shared SSE connection. The FSR watcher polls a LiveQuery and pushes SlotPatch events when values change. Routes opt in with `use pilcrow::live::*;` and the `live-props` Cargo feature. Redis (live-props-redis feature) adds a three-layer serve architecture: Redis is the hot path (pilcrow:html:<route>, pilcrow:slot:<route> HASH, pilcrow:json:<route>), Postgres is the truth layer (pilcrow_fsr table), and disk is async recovery. The watcher becomes pub/sub-driven: it subscribes to pilcrow:invalidate, re-executes stored queries, patches Redis, then publishes pilcrow:patch which is forwarded to connected SSE clients. Without Redis, the watcher falls back to 500ms polling. redis_url in [cache] of pilcrow.toml is required when using live-props-redis."
canonical_usage = """
# live.rs
use pilcrow::live::*;

#[pilcrow::live(
    promote_after = 50,
    patch_debounce = 30
)]
#[pilcrow::depends_on_route(tickets, id)]
pub struct Live {
    pub ticket_status: LiveProp<String>,
    #[pilcrow::patch_debounce(5)]
    pub ticket_priority: LiveProp<String>,
}

impl Live {
    fn query(params: &serde_json::Map<String, serde_json::Value>) -> LiveQuery {
        live_query!(
            "SELECT status AS ticket_status, priority AS ticket_priority FROM tickets WHERE id = $1",
            params.get("id").unwrap()
        )
    }
}

# page.rs
pub struct Props { pub live: Live }
pub async fn load(live: Live) -> AppResult<Props> { Ok(Props { live }) }

# page.html
<span s-live="ticket_status">{{ live.ticket_status.value }}</span>
"""
constraints = [
  "Incompatible with STREAMING = true",
  "FSR_JSON = true incompatible with STREAMING = true",
  "live.rs + PRERENDER treated as promote_after = 0",
  "promote_after absent = SSG (bake at startup)",
  "Struct-level #[pilcrow::live(...)] defaults apply to all LiveProp<T> fields.",
  "Struct-level #[pilcrow::depends_on_route(table, param)] defaults apply to all LiveProp<T> fields.",
  "Field-level #[pilcrow::*] attributes override struct-level live defaults for that field.",
  "Each s-live slot in page.html must match a LiveProp field in sibling live.rs.",
  "Each LiveProp field in live.rs must have a matching s-live slot unless marked #[pilcrow::allow_unused].",
  "Duplicate s-live slot names in a single template are build errors.",
  "depends_on_route(table, param) requires `param` to exist in the route params.",
  "dep! macro args mean table, column, runtime value.",
  "Requires the `live-props` Cargo feature on pilcrow-web",
]
