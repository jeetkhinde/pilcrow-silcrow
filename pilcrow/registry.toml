After serving cursor window N, call prebake_next with the URL for window N+1.
A Tokio task spawns a GET to http://127.0.0.1:{port}{path}; the response is
silently discarded. No-op if set_local_base has not been called.

The local base URL is set once at startup by start_with_adapter via the
on_bind callback passed to PilcrowAdapter::serve(). Each adapter calls
on_bind with its actual bound address (from listener.local_addr()), so
port-scanning (TokioAdapter) and $PORT env-var rewriting (PortEnvAdapter)
are handled correctly. LambdaAdapter drops the callback.

pub async fn load(req: Req) -> AppResult<Props> {
    let tickets = db::tickets_page(&cursor).await?;
    if let Some(next) = tickets.next_cursor {
        req.fsr.prebake_next(&format!("/tickets?cursor={next}"));
    }
    Ok(Props { tickets })
}
"""
