[[features]]
id = "service-worker"
name = "Service Worker"
domain = "pilcrow"
status = "stable"
since = "0.1.0"
summary = "Runtime-generated `/sw.js` with configurable caching strategy, precaching, and offline fallback. Disabled in dev mode."
spec = """
Configure in `Pilcrow.toml` under `[service_worker]`:

```toml
[service_worker]
enabled = true
strategy = "network-first"   # "network-first" | "cache-first" | "stale-while-revalidate"
precache = ["/", "/about"]   # URLs cached on SW install (silcrow.js always included)
exclude = ["/api/"]          # Additional URL substrings to skip (/_silcrow/ and /__pilcrow/ always excluded)
offline_fallback = "/offline" # Optional: served when network fails and no cache hit
```

Pilcrow automatically:
- Serves `GET /sw.js` with `Cache-Control: no-store` (always fresh)
- Injects `<script>navigator.serviceWorker.register('/sw.js')</script>` before `</body>` in HTML responses up to 10 MiB
- Computes a cache version (CRC32 of strategy + precache list + silcrow.js) — busts automatically on any change
- Skips `/_silcrow/` and `/__pilcrow/` from SW interception
- Disables SW in dev mode (`PILCROW_DEV=1`) to avoid stale-cache development friction

**Strategies:**
- `network-first` (default) — try network, fall back to cache on failure. Best for dynamic pages.
- `cache-first` — serve from cache immediately, network only on miss. Best for static assets.
- `stale-while-revalidate` — serve cached instantly, update cache in background. Best for semi-static content.
"""
constraints = [
  "Service worker is never registered in dev mode (PILCROW_DEV=1).",
  "/_silcrow/ and /__pilcrow/ URL prefixes are always excluded from SW interception.",
  "/sw.js is served with Cache-Control: no-store so the browser always checks for updates.",
  "silcrow.js is always added to the precache list (it has a content-hashed URL, safe to cache forever).",
  "The cache name changes automatically when strategy, precache list, or silcrow.js changes.",
  "The offline_fallback URL must be reachable and cacheable for fallback to work.",
  "HTML responses with Content-Length above 10 MiB skip service-worker registration injection and pass through unchanged with a tracing::warn.",
]
canonical_usage = """
# Pilcrow.toml
[service_worker]
enabled = true
strategy = "network-first"
precache = ["/", "/about", "/styles.css"]
offline_fallback = "/offline"
"""
