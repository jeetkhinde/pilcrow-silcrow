[[features]]
id = "incremental-ssr"
name = "Incremental SSR (ISR)"
domain = "pilcrow"
status = "stable"
summary = "Stale-while-revalidate page caching. Add pub const REVALIDATE: u64 = <secs>; to any code-behind with load() to opt in."
spec = """
ISR is implemented as of 2026-04-24. When REVALIDATE is declared in a code-behind file, routekit wraps the GET handler with a stale-while-revalidate cache layer. Three states: Fresh (return cached HTML), Stale (return stale HTML + spawn background revalidation), Miss (blocking render + cache store).

Constants (all optional except REVALIDATE):
  pub const REVALIDATE: u64 = 60;           — required to opt in; TTL in seconds
  pub const MAX_STALE: u64 = 3600;          — max age before stale is treated as miss
  pub const CACHE_TAGS: &[&str] = &["tag"]; — tags for tag-based invalidation
  pub const CACHE_VARY: &[&str] = &["session", "accept-language"];  — vary by cookie or header value

All constants are stripped from the emitted module — they never appear in generated Rust.
ISR is incompatible with Deferred<T>/DeferredHtml fields; those pages fall through to normal SSR.

Runtime types: IsrCache, IsrCacheState (Fresh/Stale/Miss), IsrHandle (req.cache).
req.res.bypass_cache() skips both cache read and write (preview/admin mode).
req.cache.revalidate_tag("tag") and req.cache.revalidate("/path") for manual invalidation.
"""
canonical_usage = """
// pages/products/index.rs
pub const REVALIDATE: u64 = 60;
pub const CACHE_TAGS: &[&str] = &["products"];

pub struct Props { pub items: Vec<Item> }
pub async fn load(req: Req) -> AppResult<Props> { ... }
"""
