Part of DEV_INJECTION. Uses silcrow:live:disconnect and silcrow:live:connect events on the
hidden `#__pilcrow_dev` SSE element as build-start / build-end signals:

  silcrow:live:disconnect → 2 s debounce → fixed bottom-right banner: "pilcrow: building…"
