[[features]]
id = "css-hot-swap"
name = "CSS Hot Swap"
domain = "pilcrow"
status = "stable"
summary = "CSS file changes are reflected in the browser without a page reload — the matching `<link>` is reinjected with a cache-busted URL."
spec = """
Part of dev mode (requires PILCROW_DEV=1). When a `.css` file in `src/` is saved:
  1. The notify watcher (OS thread) detects the change and broadcasts DevEvent::CssReload{filename}
  2. All connected SSE clients receive: event: custom / data: {"event":"css-reload","data":{"path":"<filename>"}}
  3. silcrow dispatches silcrow:sse:css-reload on document with detail = {path: "<filename>"}
  4. The injected script finds the matching <link rel="stylesheet"> by filename, clones it with
     a `?t=<timestamp>` cache-bust, inserts it after the original, and removes the original on load

cargo-watch excludes *.css from triggering server restarts (-i "*.css"). CSS changes are handled
entirely in-process — the server never restarts for a CSS-only change.

Match is by filename only (e.g. "app.css") — URL path structure is not assumed.
"""
