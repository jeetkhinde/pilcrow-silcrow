[package]
name = "pilcrow-mcp"
version = "0.1.0"
edition = "2021"
description = "AI-native MCP server for Pilcrow projects"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
rmcp = { version = "1.5.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
